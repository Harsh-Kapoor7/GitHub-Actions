name: first-workflow

on:
  schedule: 
    - cron: "5 * * * *"
  workflow_dispatch: 
  push:
    branches: ["main"]

jobs:
  job1: 
    runs-on: ubuntu-latest
    steps:
      - name: Running Single Command in Job1
        run: echo "Hi this is my first GitHub Workflow"
      - name: Checking os release for my Hosted Runner
        run: cat /etc/os-release

  job2:
    runs-on: ubuntu-latest
    steps:
      - name: Checking the Hostname for Runner
        run: hostname
      - name: Running multiple commands
        run: |
          echo "Hi from Kapoor"
          echo "current time is `date`"  
          sleep 20  

  job3:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Job with single dependency
        run: sleep 10

  job4:
    runs-on: macos-latest
    needs: [job1, job2, job3]
    steps:
      - name: Job with multiple dependencies
        run: sleep 10
      - name: Checking Runner info
        run: sw_vers
