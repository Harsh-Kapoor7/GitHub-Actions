name: first-workflow

on:
  push:
    branches: ["main"]
  pull_request: 
    branches: ["main"]

env:
  ENV_TYPE: DEV
  APP_USER: thinknyx
  APP_PORT: 80

jobs:
  job1: 
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Step-3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Upload Single file
        uses: actions/upload-artifact@v6.0.0
        with:
          name: single_file
          path: ./myartifact.txt
          if-no-files-found: warn
          retention-days: 2
          overwrite: true
          include-hidden-files: false


  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: checking current directory
        run: | 
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: single_file
      - name: Referring environment variables
        run: | 
          echo "[INFO] Running deployment for $ENV_TYPE with user $APP_USER"
          echo "[INFO] Once deployment application is accessible on port $APP_PORT"


  job3:
    runs-on: ubuntu-latest
    steps:
      - name: Referring context or in-built variables
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }}"
          echo "[INFO] New changes are added by ${{ github.actor }} in ${{ github.ref_name }} branch."
          echo "[INFO] Current stepp is running on ${{ runner.os }}"
          echo "[INFO] Current JOB ID is ${{ job.check_run_id }}"

  staging:
    name: STAGING DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Referring environment variables
        run: echo "[INFO] Running deplyment on ${{ vars.HOST }} using ${{ vars.USER }}"
      - name: Referring environment secrets
        run: echo "[INFO] Password for ${{ vars.USER }} is ${{ secrets.PASSWORD }}" 
    environment:
      name: STAGING
    if: github.ref == 'refs/heads/dev'

  production:
    name: PRODUCTION DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Referring to environement variables
        run: echo "[INFO] Running deplyment on ${{ vars.HOST }} using ${{ vars.USER }}"
      - name: Referring environment secrets
        run: echo "[INFO] Password for %{{ vars.USER }} is ${{ secrets.PASSWORD }}"
    environment:
      name: PRODUCTION
    if: github.ref == 'refs/heads/dev'





    

