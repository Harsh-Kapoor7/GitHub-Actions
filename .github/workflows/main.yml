name: first-workflow

on:
  push:
    branches: ["main", "dev"]
  pull_request: 
    branches: ["main"]

jobs:
  unit-tests: 
    name: Running unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with: 
          python-version: "3.10"
      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit Tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml   --cov-report=term-missing -v
      - name: Upload code coverega reports
        uses: actions/upload-artifact@v6.0.0
        with: 
          name: unit-test-report
          path: reports/

  codeql:
    name: CodeQL Security scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix: 
        language: ['python']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v1
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v1.1
        with:
          category: 'security'

